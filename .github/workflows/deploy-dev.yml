name: Deploy and Seed Dev Environment

on:
  push:
    branches:
      - development

jobs:
  deploy-and-seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Deploy to Railway
        uses: railwayapp/railway-github-action@v1
        with:
          railway_token: ${{ secrets.RAILWAY_DEV_TOKEN }}
          project_id: ${{ secrets.RAILWAY_DEV_PROJECT_ID }}
          service_id: ${{ secrets.RAILWAY_DEV_SERVICE_ID }}
          environment: production
          working_directory: backend

      - name: Seed Database
        uses: railwayapp/railway-github-action@v1
        with:
          railway_token: ${{ secrets.RAILWAY_DEV_TOKEN }}
          project_id: ${{ secrets.RAILWAY_DEV_PROJECT_ID }}
          service_id: ${{ secrets.RAILWAY_DEV_SERVICE_ID }}
          environment: production
          working_directory: backend
          command: go run cmd/seed/main.go

      - name: Notify Success
        if: success()
        run: echo "✅ Dev environment deployed and seeded successfully!"

      - name: Show deployment status
        if: always()
        run: echo "Workflow completed - check Railway dashboard for deployment status"
